name: Release

# Builds the bundled AppImage and attaches it (plus checksums) to the GitHub
# Release. Triggered by pushing a version tag (e.g. v0.2.0), or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # dosbox-staging build bundled into the AppImage (downloaded by the script).
  DOSBOX_STAGING_VERSION: "0.82.0"

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-4-dev librsvg2-common file curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # The script downloads the pinned dosbox-staging itself (DOSBOX_STAGING_VERSION),
      # so local and CI builds share one code path.
      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum dosui*.AppImage > SHA256SUMS

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/dosui*.AppImage
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dosui-AppImage
          path: |
            dist/dosui*.AppImage
            dist/SHA256SUMS
