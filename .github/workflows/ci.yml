name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # A merge performed by GITHUB_TOKEN (our Dependabot auto-merge) does not
  # raise a `push` event, so an auto-merged commit would otherwise never be
  # built on main. Branch protection is strict, so the merged tree is always
  # one CI already passed — this weekly run is the independent check on top,
  # and it catches breakage that arrives without a commit: `@stable` moving to
  # a Rust release with new clippy lints (fatal here, RUSTFLAGS is -D warnings)
  # or a changed runner image.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref. Only for pull requests: on main every
# commit must keep its own verdict, and cancelling would leave the very gap
# this workflow's schedule exists to close.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK 4 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

  # Guards the `rust-version` in Cargo.toml. Without this the declared MSRV
  # drifts silently as dependencies raise theirs (it had slipped from 1.80 to a
  # real 1.88 unnoticed).
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK 4 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --all-features
