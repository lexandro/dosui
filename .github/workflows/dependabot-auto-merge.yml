name: Dependabot auto-merge

# Queues patch-level Dependabot PRs for auto-merge. Minor/major bumps stay
# manual on purpose — only patch releases are safe to land unreviewed.
#
# What makes an unreviewed merge safe is branch protection on main, not this
# file: both "fmt · clippy · test · build" and "MSRV (1.88)" are required, and
# `strict` is on, so the branch must be up to date before it can merge. That
# last part is what makes the passing run meaningful — a squash of an
# up-to-date branch has the same tree CI just tested. Without strict, a PR
# green against a stale base could land a tree nothing ever built, and the
# merge itself raises no `push` event (GITHUB_TOKEN merges never do), so no
# run on main would catch it either. Do not turn strict off.
on: pull_request

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; these two
# scopes are the minimum needed to enable auto-merge on the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The repository guard keeps this from firing on forks.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'lexandro/dosui'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For grouped PRs (this repo groups all cargo/actions deps) update-type is
      # the *highest* bump in the group, so a group containing one minor update
      # is correctly excluded.
      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
