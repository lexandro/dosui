[package]
name = "dosui"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight native Linux frontend for DOSBox, D-Fend Reloaded style"
authors = ["lexandro2000 <lexandro2000@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lexandro/dosui"
homepage = "https://github.com/lexandro/dosui"
keywords = ["dosbox", "frontend", "launcher", "gtk4", "retro"]
categories = ["games", "gui"]
exclude = ["/docs", "/packaging", "/.github", "/data/*.png"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }

serde = { version = "1", features = ["derive"] }
toml = "1.1"
indexmap = { version = "2", features = ["serde"] }

directories = "6"
which = "8"
zip = "8"

anyhow = "1"
thiserror = "2"

log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
